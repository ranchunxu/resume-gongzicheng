<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#18191b">
<meta name="color-scheme" content="dark">
<meta name="description" content="巩子成 · 燕山大学机械类 · 个人简历">
<title>巩子成 · 个人简历</title>
<style>
/* ============ 中性石墨灰令牌（全站唯一配色来源，不含任何彩色） ============ */
:root{
  --bg:#18191b; --bg-2:#141517; --surface:#1f2023; --surface-2:#242528;
  --ink:#e9eaec; --ink-strong:#ffffff; --muted:#8d9094;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.22);
  /* 唯一强调色：工程蓝（仅用于当前导航项与主按钮） */
  --blue:#3b82f6; --blue-soft:rgba(59,130,246,.14);
  --shadow-s:0 1px 0 rgba(255,255,255,.03);
  --shadow-m:0 8px 24px rgba(0,0,0,.35);
  --shadow-l:0 20px 50px rgba(0,0,0,.45);
  /* 直角化：图纸语言，圆角一律收小 */
  --radius:4px; --radius-s:2px; --nav-h:60px; --maxw:1040px;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Times New Roman","Songti SC","Noto Serif SC","SimSun",serif;
  /* 等宽字体：用于编号、数值、时间、证书编号等“标注类”文本 */
  --mono:ui-monospace,SFMono-Regular,Consolas,"Cascadia Mono","Courier New",monospace;
  --ease:cubic-bezier(.22,.7,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.72; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  /* 方格纸网格：24px 细格 + 120px 主格，模拟工程图纸坐标格 */
  background:
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 120px 120px,
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0 / 120px 120px,
    var(--bg);
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:rgba(255,255,255,.85); color:#18191b}
a{color:var(--ink); text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px}
img{max-width:100%; display:block}
/* 窄屏保护：邮箱、证书编号、机构名等长串不撑破卡片 */
ul.pts li,.cert-row,.cert-name,.tl-org,.card-title,.aside-row span{overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--blue); outline-offset:3px; border-radius:2px}
.only-print{display:none}
/* 待补标记：页面内容已全部填齐，此处仅为日后留用 */
.is-todo{color:var(--ink); font-style:normal; border-bottom:1px dashed var(--line-strong)}

/* ============ 顶部导航 ============ */
#navbar{
  position:fixed; inset:0 0 auto 0; height:var(--nav-h); z-index:120;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:0 16px; padding-top:env(safe-area-inset-top);
  /* 移动端/微信：不透明底，不用毛玻璃，规避 X5 内核滚动掉帧与合成层闪烁 */
  background:#161719;
  border-bottom:1px solid var(--line);
}
.nav-brand{
  font-family:var(--serif); font-size:1.08rem; font-weight:600; letter-spacing:2px;
  color:var(--ink-strong); display:flex; align-items:center; gap:8px; min-height:44px; text-decoration:none;
}
.nav-brand i{width:7px; height:7px; border-radius:50%; background:var(--ink-strong); display:block}
.nav-links{
  display:none; position:absolute; top:var(--nav-h); left:0; right:0;
  flex-direction:column; gap:2px; padding:10px 14px 16px;
  background:var(--surface); border-bottom:1px solid var(--line); box-shadow:var(--shadow-m);
}
.nav-links.open{display:flex}
.nav-links a{
  min-height:44px; display:flex; align-items:center; padding:0 12px; border-radius:var(--radius-s);
  color:var(--muted); font-size:.98rem; text-decoration:none;
  transition:color .18s var(--ease), background .18s var(--ease);
}
.nav-links a:hover{color:var(--ink); background:rgba(255,255,255,.05)}
.nav-links a.active{color:var(--blue); font-weight:600; box-shadow:inset 0 -2px 0 var(--blue)}
.nav-actions{display:flex; align-items:center; gap:6px}
.icon-btn{
  width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:transparent; color:var(--ink); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:border-color .18s var(--ease), color .18s var(--ease);
}
.icon-btn:hover{border-color:var(--line-strong); color:var(--ink-strong)}
.icon-btn svg{width:20px; height:20px}

/* ============ 主体 ============ */
main{max-width:var(--maxw); margin:0 auto; padding:calc(var(--nav-h) + 26px) 16px 0}
section{margin-bottom:52px; scroll-margin-top:calc(var(--nav-h) + 14px)}
.sec-head{margin-bottom:20px}
.sec-title{
  font-family:var(--serif); font-size:1.3rem; font-weight:600; letter-spacing:1px;
  display:flex; align-items:baseline; gap:10px;
}
/* 图纸式编号：SEC.01 */
.sec-title .idx{font-family:var(--mono); font-size:.76rem; font-weight:500; letter-spacing:1.5px; color:var(--muted)}
.sec-title .idx::before{content:"SEC."}
/* 制图式尺寸标注线：两端带端标 */
.sec-rule{position:relative; height:1px; border:0; margin:10px 0 0; background:var(--line-strong)}
.sec-rule::before,.sec-rule::after{content:""; position:absolute; top:-3px; width:1px; height:7px; background:var(--line-strong)}
.sec-rule::before{left:0}
.sec-rule::after{right:0}

/* ============ Hero ============ */
.hero{
  position:relative; border-radius:var(--radius); padding:30px 22px;
  color:var(--ink); box-shadow:var(--shadow-l);
  border:1px solid var(--line); background:var(--surface);
}
/* 剖面线标记 + 图纸式小标签 */
.hero-kicker{font-family:var(--mono); font-size:.76rem; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; align-items:center}
.hero-kicker::before{
  content:""; width:34px; height:8px; margin-right:10px; flex:0 0 auto;
  background:repeating-linear-gradient(45deg, var(--muted) 0 1px, transparent 1px 4px);
}
.hero-name{
  font-family:var(--serif); font-size:clamp(2rem,8vw,2.5rem); font-weight:600; letter-spacing:4px;
  color:var(--ink-strong);
}
.hero-rule{position:relative; width:54px; height:1px; border:0; margin:16px 0 14px; background:var(--ink-strong)}
.hero-rule::after{content:""; position:absolute; right:0; top:-3px; width:1px; height:7px; background:var(--ink-strong)}
.hero-role{font-size:1rem; font-weight:600; color:var(--ink); margin-bottom:10px}
.hero-intro{max-width:640px; font-size:.95rem; color:var(--muted); margin-bottom:18px}
.hero-badges{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
.badge{
  padding:5px 13px; border-radius:var(--radius-s); font-size:.78rem; letter-spacing:.4px;
  color:var(--ink); background:rgba(255,255,255,.04); border:1px solid var(--line);
}
.hero-actions{display:flex; flex-wrap:wrap; gap:10px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
  padding:11px 20px; border-radius:var(--radius-s); border:1px solid transparent; cursor:pointer;
  font-family:var(--sans); font-size:.9rem; font-weight:600; letter-spacing:.3px; text-decoration:none;
  transition:background .18s var(--ease), border-color .18s var(--ease), color .18s var(--ease);
}
.btn svg{width:17px; height:17px}
/* 按钮底蓝压深一档：#2563eb 配白字对比度约 4.9:1（#3b82f6 仅 3.7:1） */
.btn-primary{background:#2563eb; color:#fff; border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8; border-color:#1d4ed8}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink); color:var(--ink-strong)}
/* 手机/微信端优先「复制链接」，隐藏无用的「导出 PDF」（微信内置浏览器不支持 window.print） */
.btn-link{display:inline-flex}
.btn-pdf{display:none}
.hero-aside{
  margin-top:26px; padding:16px; border-radius:var(--radius);
  background:var(--surface-2); border:1px solid var(--line);
}
.aside-row{display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:.88rem; color:var(--muted); text-decoration:none}
.aside-row + .aside-row{border-top:1px dashed var(--line)}
.aside-row svg{width:17px; height:17px; flex:0 0 auto; margin-top:3px; color:var(--muted)}
.aside-row b{font-weight:600; color:var(--ink); letter-spacing:.3px}
.aside-row span{font-family:var(--mono); font-size:.85rem; letter-spacing:0}

/* ============ 亮点卡 ============ */
.hl-grid{display:grid; grid-template-columns:1fr; gap:12px}
.hl-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow-s); position:relative;
  transition:transform .15s var(--ease), border-color .15s var(--ease);
}
/* 右上角十字定位标（制图定位符） */
.hl-card::after{
  content:""; position:absolute; top:7px; right:7px; width:7px; height:7px; opacity:.45;
  background:
    linear-gradient(var(--muted),var(--muted)) center / 7px 1px no-repeat,
    linear-gradient(var(--muted),var(--muted)) center / 1px 7px no-repeat;
}
.hl-card:hover{transform:translateY(-2px); border-color:var(--line-strong)}
.hl-value{font-family:var(--mono); font-size:1.5rem; font-weight:600; letter-spacing:0; color:var(--ink-strong)}
.hl-label{font-size:.9rem; font-weight:600; margin-top:2px}
.hl-desc{font-size:.84rem; color:var(--muted); margin-top:6px}

/* ============ Tabs ============ */
.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-height:44px; padding:9px 18px; border-radius:var(--radius-s); white-space:nowrap; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:var(--sans); font-size:.9rem; font-weight:600;
  transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
}
.tab:hover{border-color:var(--line-strong); color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink-strong); border-color:var(--ink-strong); color:#18191b}
.panel{padding-top:20px}
.tl-item{position:relative; padding:0 0 22px 20px; border-left:1px solid var(--line-strong)}
.tl-item:last-child{border-left-color:transparent; padding-bottom:0}
/* 方块节点：制图刻度感 */
.tl-item::before{
  content:""; position:absolute; left:-4px; top:7px; width:7px; height:7px; border-radius:1px;
  background:var(--bg); border:1px solid var(--muted);
}
.tl-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px}
.tl-role{font-size:1rem; font-weight:600}
.tl-org{font-size:.9rem; color:var(--muted); font-weight:600}
.tl-period{font-family:var(--mono); font-size:.78rem; color:var(--muted); border:1px solid var(--line); border-radius:var(--radius-s); padding:2px 8px}
ul.pts{margin:10px 0 0; padding:0; list-style:none}
ul.pts li{position:relative; padding-left:16px; font-size:.91rem; color:var(--ink); margin-bottom:6px}
ul.pts li::before{content:""; position:absolute; left:2px; top:.66em; width:5px; height:5px; border-radius:50%; background:var(--muted)}

/* ============ 通用卡片 ============ */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; box-shadow:var(--shadow-s); position:relative;
  transition:transform .15s var(--ease), border-color .15s var(--ease);
}
.card::after{
  content:""; position:absolute; top:7px; right:7px; width:7px; height:7px; opacity:.45;
  background:
    linear-gradient(var(--muted),var(--muted)) center / 7px 1px no-repeat,
    linear-gradient(var(--muted),var(--muted)) center / 1px 7px no-repeat;
}
.card:hover{transform:translateY(-2px); border-color:var(--line-strong)}
.grid{display:grid; grid-template-columns:1fr; gap:14px}
.card-title{font-size:1rem; font-weight:700; display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.card-sub{font-size:.86rem; color:var(--muted); margin-top:2px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{
  font-size:.78rem; padding:4px 11px; border-radius:var(--radius-s); color:var(--ink);
  background:rgba(255,255,255,.04); border:1px solid var(--line);
}
.link-btn{
  margin-top:12px; display:inline-flex; align-items:center; gap:6px; min-height:38px;
  font-size:.85rem; font-weight:600; color:var(--ink); text-decoration:none;
}
.link-btn svg{width:15px; height:15px}

/* ============ 技能 ============ */
.skill-head{font-size:.82rem; font-weight:600; letter-spacing:1px; color:var(--muted); text-transform:uppercase}
.skill-head + .chips{margin-top:10px}
.bar{height:6px; border-radius:999px; background:rgba(255,255,255,.08); margin-top:10px; overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--ink)}

/* ============ 教育 / 证书 ============ */
.edu-school{font-size:1.05rem; font-weight:700}
.edu-major{font-size:.9rem; color:var(--muted); font-weight:600}
.cert-row{
  display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline;
  padding:12px 0; border-bottom:1px dashed var(--line);
}
.cert-row:last-child{border-bottom:0}
.cert-name{font-size:.93rem; font-weight:600; flex:1 1 240px}
.cert-meta{font-family:var(--mono); font-size:.78rem; color:var(--muted)}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; margin-top:18px}
/* 白底证书图保持原样完整显示，只给 1px 细线卡片，不做装裱与发光 */
.cert-fig{
  background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  padding:5px; cursor:zoom-in;
  transition:transform .15s var(--ease), border-color .15s var(--ease);
}
.cert-fig:hover,.cert-fig:focus-visible{transform:translateY(-2px); border-color:var(--line-strong)}
.cert-fig img{width:100%; height:126px; object-fit:contain; background:#fff; border-radius:2px}
.cert-fig figcaption{padding:8px 4px 6px; font-size:.78rem; color:var(--muted); line-height:1.45}

/* ============ 灯箱 ============ */
#lightbox{
  position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center;
  padding:22px; background:rgba(16,17,18,.94);
}
#lightbox.open{display:flex}
#lightbox img{
  max-width:min(100%,980px); max-height:82vh; border-radius:8px; background:#fff;
  border:1px solid rgba(255,255,255,.16);
}
#lbCap{position:absolute; bottom:calc(26px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:var(--ink); font-size:.88rem; padding:0 22px}
#lbClose{
  position:absolute; top:calc(16px + env(safe-area-inset-top)); right:16px; width:44px; height:44px;
  border-radius:50%; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08); color:#fff;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  transition:background .18s var(--ease), border-color .18s var(--ease);
}
#lbClose:hover{background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.45)}

/* ============ 页脚 & 悬浮按钮 ============ */
footer{max-width:var(--maxw); margin:0 auto; padding:26px 16px calc(34px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); color:var(--muted); font-size:.82rem}
/* 仅手机显示的分享提示 */
.foot-hint{font-family:var(--mono); font-size:.78rem; color:var(--muted); margin-top:12px}
.only-mobile{display:block}
.foot-row{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between}
#footerQr{width:104px; border-radius:10px; border:1px solid var(--line); margin-top:14px; background:#fff; padding:6px}
.fab{
  position:fixed; right:16px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:110;
  width:46px; height:46px; border-radius:50%; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  display:inline-flex; align-items:center; justify-content:center;
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity .22s var(--ease), transform .22s var(--ease), visibility .22s, border-color .18s var(--ease);
}
.fab.show{opacity:1; visibility:visible; transform:none}
.fab:hover{border-color:var(--line-strong)}
.fab svg{width:20px; height:20px}

/* ============ 进入淡入 ============ */
.reveal{opacity:0; transform:translateY(14px); transition:opacity .24s var(--ease), transform .24s var(--ease)}
.reveal.in{opacity:1; transform:none}

/* ============ 桌面增强（移动优先） ============ */
@media (min-width:821px){
  :root{--nav-h:66px}
  /* 桌面才启用毛玻璃导航与「导出 PDF」，并隐藏「复制链接」与手机专属提示 */
  #navbar{padding:0 max(24px, calc((100vw - var(--maxw)) / 2)); background:rgba(24,25,27,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px)}
  .btn-pdf{display:inline-flex}
  .btn-link{display:none}
  .only-mobile{display:none}
  .menu-btn{display:none}
  .nav-links{
    display:flex !important; position:static; flex-direction:row; flex:1; justify-content:center;
    gap:2px; padding:0; background:transparent; border:0; box-shadow:none;
  }
  .nav-links a{min-height:38px; font-size:.92rem; padding:0 13px}
  main{padding:calc(var(--nav-h) + 40px) 24px 0}
  section{margin-bottom:66px}
  .sec-title{font-size:1.5rem}
  .hero{display:grid; grid-template-columns:1.5fr .95fr; gap:34px; align-items:center; padding:46px 44px}
  .hero-aside{margin-top:0}
  .hl-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px}
  .gallery{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .cert-fig img{height:152px}
  .hl-value{font-size:1.62rem}
}

/* ============ 减少动态效果 ============ */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
  .reveal{opacity:1; transform:none}
}

/* ============ 打印 ============ */
@media print{
  :root{
    color-scheme:light;
    --bg:#fff; --bg-2:#fff; --surface:#fff; --surface-2:#fff;
    --ink:#000; --ink-strong:#000; --muted:#444;
    --line:#c8c8c8; --line-soft:#ddd; --line-strong:#999;
    --shadow-s:none; --shadow-m:none; --shadow-l:none;
  }
  body{background:#fff !important; color:#000}
  #navbar,.fab,#lightbox,.hero-actions,.tabs{display:none !important}
  main{padding:0; max-width:none}
  footer{padding:12px 0 0; max-width:none; border-top-color:#bbb; color:#333}
  section{margin-bottom:20px; break-inside:avoid; page-break-inside:avoid}
  .sec-rule{background:#999}
  .sec-rule::before,.sec-rule::after{background:#999}
  /* 纸面上不需要角标与剖面线装饰 */
  .card::after,.hl-card::after{display:none}
  .hero-kicker::before{display:none}
  .only-print{display:block !important}
  .only-mobile{display:none !important}
  .panel[hidden]{display:block !important}
  .print-label{display:block; font-weight:700; font-size:1rem; margin:14px 0 6px; border-bottom:1px solid #bbb}
  .hero{
    color:#000; box-shadow:none; border:1px solid #bbb; border-radius:10px; padding:18px;
    background:#fff !important; display:block;
  }
  .hero-name,.hero-role{color:#000 !important}
  .hero-kicker{color:#444 !important}
  .hero-rule{background:#333 !important}
  .hero-intro{color:#222 !important}
  .hero-aside{margin-top:12px; background:#fafafa; border-color:#ccc}
  .aside-row{color:#222}
  .aside-row b{color:#000}
  .aside-row svg{color:#555 !important}
  .badge{color:#111; border-color:#999; background:#f4f4f4}
  .card,.hl-card,.cert-fig{box-shadow:none; break-inside:avoid; page-break-inside:avoid; border-color:#ccc; background:#fff}
  .card:hover,.hl-card:hover,.cert-fig:hover{transform:none; box-shadow:none}
  .hl-value,.hl-label{color:#000}

      const data = list[i];
      const cap = fig.querySelector('figcaption');
      if (cap && data && data.name) cap.textContent = data.name;
      fig.addEventListener('click', function () { openBox(fig, cap ? cap.textContent : ''); });
      fig.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBox(fig, cap ? cap.textContent : ''); }
      });
    });

    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCap = document.getElementById('lbCap');
    const lbClose = document.getElementById('lbClose');
    lbClose.innerHTML = ICON.close;

    function openBox(fig, caption) {
      const img = fig.querySelector('img');
      if (!img) return;
      lbImg.src = img.getAttribute('src');
      lbImg.alt = img.getAttribute('alt') || caption;
      lbCap.textContent = caption || '';
      lb.classList.add('open');
      lbClose.focus();
      document.addEventListener('keydown', escClose);
    }
    function escClose(e) { if (e.key === 'Escape') closeBox(); }
    function closeBox() {
      lb.classList.remove('open');
      lbImg.removeAttribute('src');
      document.removeEventListener('keydown', escClose);
    }
    lb.addEventListener('click', function (e) { if (e.target === lb || e.target === lbClose) closeBox(); });
  }

  /* ---------- 页脚 ---------- */
  function renderFooter() {
    document.getElementById('footCopy').textContent = '© ' + new Date().getFullYear() + ' ' + (resume.name || '') + ' · 个人简历';
    document.getElementById('footUpdated').textContent = resume.updatedAt ? '最近更新：' + resume.updatedAt : '';
    const qr = document.getElementById('footerQr');
    const src = qr.getAttribute('src') || '';
    if (src.indexOf('data:') === 0) qr.hidden = false; else qr.remove();
  }

  /* ---------- 返回顶部 / 滚动高亮 / 进入淡入 ---------- */
  function bindScroll() {
    toTop.innerHTML = ICON.up;
    toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
    const onScroll = function () {
      if (window.scrollY > 420) toTop.classList.add('show'); else toTop.classList.remove('show');
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    const secs = SECTIONS.map(function (p) { return document.getElementById(p[0]); }).filter(Boolean);
    if ('IntersectionObserver' in window) {
      const visible = {};
      const io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          en.target.classList.toggle('in', en.isIntersecting);
          visible[en.target.id] = en.isIntersecting && en.intersectionRatio > 0.3;
        });
        /* 取文档顺序中最靠上的可见区块作为当前高亮，避免一次高亮多个 */
        let active = '';
        for (let i = 0; i < SECTIONS.length; i++) {
          if (visible[SECTIONS[i][0]]) { active = SECTIONS[i][0]; break; }
        }
        if (!active) return;
        navLinks.querySelectorAll('a').forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('data-sec') === active);
        });
      }, { threshold: [0, 0.3] });
      secs.forEach(function (s) { io.observe(s); });
    } else {
      document.querySelectorAll('.reveal').forEach(function (n) { n.classList.add('in'); });
    }

    /* 兜底：若 1.5 秒内观察器始终没有触发（个别环境/浏览器差异），强制显示全部内容，避免整页空白 */
    setTimeout(function () {
      if (!document.querySelector('.reveal.in')) {
        document.querySelectorAll('.reveal').forEach(function (n) { n.classList.add('in'); });
      }
    }, 1500);
  }

  /* ---------- 区块编号：按实际渲染出来的区块自动重排，避免隐藏模块导致跳号 ---------- */
  function renumber() {
    let n = 0;
    document.querySelectorAll('main > section').forEach(function (sec) {
      const idx = sec.querySelector('.sec-title .idx');
      if (!idx) return;
      n++;
      idx.textContent = (n < 10 ? '0' : '') + n;
    });
  }

  /* ---------- 启动 ---------- */
  emailCache();
  renderHero();
  renderHighlights();
  renderExperience();
  renderProjects();
  renderSkills();
  renderEducation();
  renderCerts();
  renderFooter();
  renumber();
  buildNav();
  bindScroll();
})();
</script>
</body>
</html>
